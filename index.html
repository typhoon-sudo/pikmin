<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pikmin Postcard Vault</title>

  <!-- Favicon & Apple Touch Icon -->
  <link rel="icon" type="image/png" href="pikminlogo.png">
  <link rel="apple-touch-icon" href="pikminlogo.png">

  <!-- PWA Settings -->
  <meta name="theme-color" content="#2e7d32">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.json">

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS & MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, input, button, select, textarea, .leaflet-container, .leaflet-popup-content-wrapper, .leaflet-popup-content {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif !important;
    }
    body { display: flex; height: 100vh; width: 100vw; overflow: hidden; background: #f4f6f8; position: relative; }
    #map { flex: 1; height: 100%; width: 100%; z-index: 1; }

    /* Dimmed Backdrop */
    #drawer-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      z-index: 9998;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    #drawer-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Sidebar / Bottom Sheet Container */
    #sidebar {
      width: 380px;
      background: #ffffff;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      z-index: 9999;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .header {
      padding: 14px 16px;
      background: #2e7d32;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 { font-size: 1.1rem; font-weight: 600; }
    .close-btn { background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; display: none; }
    .content-area { overflow-y: auto; flex: 1; }
    .form-container { padding: 16px; border-bottom: 1px solid #eee; background: #fafafa; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: #555; }
    .form-group input { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; }
    #preview-container { display: none; margin-top: 8px; width: 100%; height: 120px; border-radius: 6px; overflow: hidden; border: 1px solid #ddd; }
    #preview-img { width: 100%; height: 100%; object-fit: contain; background: #111; }
    .btn-primary { width: 100%; padding: 10px; background: #4CAF50; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: #388E3C; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; }

    #postcard-list { padding: 16px; }
    .search-box { width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; }
    .list-title { font-size: 0.85rem; font-weight: 700; color: #888; text-transform: uppercase; margin-bottom: 12px; letter-spacing: 0.5px; }
    .mini-card { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid #eee; border-radius: 8px; margin-bottom: 8px; background: #fff; position: relative; }
    .mini-card img { width: 50px; height: auto; aspect-ratio: 1023 / 684; object-fit: contain; border-radius: 4px; background: #f0f0f0; cursor: pointer; }
    .mini-card-info { flex: 1; font-size: 0.8rem; cursor: pointer; }
    .mini-card-info strong { display: block; color: #333; }
    .mini-card-info span { color: #666; font-size: 0.75rem; }
    .delete-btn-text { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-weight: 600; transition: background 0.2s; }
    .delete-btn-text:hover { background: #ffcdd2; }

    /* Mobile Floating Trigger Button */
    #mobile-fab {
      display: none;
      position: fixed;
      bottom: 24px;
      right: 20px;
      z-index: 9997;
      background: #2e7d32;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 30px;
      font-weight: 600;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      cursor: pointer;
      pointer-events: auto;
    }

    .popup-gallery { width: 250px; max-height: 320px; overflow-y: auto; padding: 2px; }
    .popup-item { border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
    .popup-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
    .popup-title { font-weight: 700; font-size: 0.88rem; color: #2c3e50; line-height: 1.2; }
    .popup-location { font-size: 0.75rem; color: #666; margin-top: 2px; margin-bottom: 6px; }
    .popup-item img { width: 100%; height: auto; aspect-ratio: 1023 / 684; object-fit: contain; border-radius: 6px; display: block; background: #f8f8f8; }
    .popup-actions { display: flex; justify-content: flex-end; margin-top: 6px; }
    .popup-delete-btn { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; font-size: 0.72rem; padding: 3px 8px; border-radius: 4px; cursor: pointer; font-weight: 600; }
    .popup-delete-btn:hover { background: #ffcdd2; }

    .custom-dot-marker { background-color: #2e7d32; border: 2px solid #ffffff; border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background-color: rgba(46, 125, 50, 0.3) !important; }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div { background-color: #2e7d32 !important; color: white !important; font-weight: bold; }

    /* Mobile Responsive Layout */
    @media (max-width: 767px) {
      #drawer-backdrop { display: block; }
      #sidebar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 80vh;
        max-height: 80vh;
        border-radius: 16px 16px 0 0;
        border-right: none;
        transform: translateY(100%);
      }
      #sidebar.open { transform: translateY(0); }
      .close-btn { display: block; }
      #mobile-fab { display: block; }
    }
  </style>
</head>
<body>

  <div id="drawer-backdrop"></div>
  <button id="mobile-fab">✚ Postcard Vault</button>

  <div id="sidebar">
    <div class="header">
      <h1>Postcard Vault</h1>
      <button class="close-btn" id="close-drawer-btn">✕</button>
    </div>

    <div class="content-area">
      <div class="form-container">
        <form id="upload-form">
          <div class="form-group">
            <label for="card-title">Postcard Title</label>
            <input type="text" id="card-title" placeholder="e.g., Pikmin Monument" required />
          </div>

          <div class="form-group">
            <label for="area-input">District / Area</label>
            <input type="text" id="area-input" placeholder="e.g., Kita Ward, Osaka" required />
          </div>

          <div class="form-group">
            <label for="image-input">Postcard Screenshot</label>
            <input type="file" id="image-input" accept="image/*" required />
            <div id="preview-container">
              <img id="preview-img" src="" alt="Preview" />
            </div>
          </div>

          <button type="submit" id="submit-btn" class="btn-primary">Add to Map</button>
        </form>
      </div>

      <div id="postcard-list">
        <div class="list-title">Saved Postcards</div>
        <input type="text" id="search-input" class="search-box" placeholder="Search by title or district..." />
        <div id="cards-container"></div>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS & MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const map = L.map('map', { zoomControl: false, minZoom: 4, maxZoom: 19 }).setView([23.9756, 120.9738], 7);
    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', minZoom: 4, maxZoom: 19
    }).addTo(map);

    const markerClusterGroup = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 45 });
    map.addLayer(markerClusterGroup);

    let districtRegistry = {};
    const mapMarkers = {};
    let currentBase64Image = "";

    const sidebar = document.getElementById('sidebar');
    const mobileFab = document.getElementById('mobile-fab');
    const closeDrawerBtn = document.getElementById('close-drawer-btn');
    const drawerBackdrop = document.getElementById('drawer-backdrop');
    const imageInput = document.getElementById('image-input');
    const previewContainer = document.getElementById('preview-container');
    const previewImg = document.getElementById('preview-img');
    const uploadForm = document.getElementById('upload-form');
    const submitBtn = document.getElementById('submit-btn');
    const searchInput = document.getElementById('search-input');
    const cardsContainer = document.getElementById('cards-container');

    // Isolate control UI elements from Leaflet map touches
    L.DomEvent.disableClickPropagation(mobileFab);
    L.DomEvent.disableScrollPropagation(mobileFab);
    L.DomEvent.disableClickPropagation(sidebar);
    L.DomEvent.disableScrollPropagation(sidebar);

    function openVault() {
      sidebar.classList.add('open');
      drawerBackdrop.classList.add('active');
    }

    function closeVault() {
      sidebar.classList.remove('open');
      drawerBackdrop.classList.remove('active');
    }

    mobileFab.addEventListener('click', openVault);
    closeDrawerBtn.addEventListener('click', closeVault);
    drawerBackdrop.addEventListener('click', closeVault);

    searchInput.addEventListener('input', renderSidebarList);

    function saveStorage() {
      try {
        localStorage.setItem('pikmin_postcards_db', JSON.stringify(districtRegistry));
      } catch (e) {
        alert("Storage limit reached! Consider using smaller images.");
      }
    }

    function loadStorage() {
      const savedData = localStorage.getItem('pikmin_postcards_db');
      if (savedData) {
        districtRegistry = JSON.parse(savedData);
        Object.keys(districtRegistry).forEach(areaKey => updateMapMarker(areaKey));
        renderSidebarList();
      }
    }

    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          currentBase64Image = event.target.result;
          previewImg.src = currentBase64Image;
          previewContainer.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    uploadForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      const title = document.getElementById('card-title').value.trim();
      const area = document.getElementById('area-input').value.trim();
      const areaKey = area.toLowerCase();

      submitBtn.disabled = true;
      submitBtn.innerText = "Finding location...";

      try {
        let lat, lng;
        if (districtRegistry[areaKey]) {
          lat = districtRegistry[areaKey].lat;
          lng = districtRegistry[areaKey].lng;
        } else {
          const endpoint = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(area)}`;
          const response = await fetch(endpoint, {
            headers: { 'Accept-Language': 'en' }
          });
          const results = await response.json();
          if (!results || results.length === 0) {
            alert("Could not find coordinates for that area. Please check spelling.");
            return;
          }
          lat = parseFloat(results[0].lat);
          lng = parseFloat(results[0].lon);
        }

        if (!districtRegistry[areaKey]) {
          districtRegistry[areaKey] = { areaName: area, lat, lng, cards: [] };
        }

        const cardId = 'card_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
        districtRegistry[areaKey].cards.push({ id: cardId, title, image: currentBase64Image });

        saveStorage();
        updateMapMarker(areaKey);
        renderSidebarList();

        uploadForm.reset();
        previewContainer.style.display = 'none';
        currentBase64Image = "";

        closeVault();
        map.flyTo([lat, lng], 11, { duration: 1.2 });
      } catch (err) {
        alert("Geocoding service unavailable or network connection lost.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Add to Map";
      }
    });

    function updateMapMarker(areaKey) {
      const data = districtRegistry[areaKey];
      let popupHtml = `<div class="popup-gallery">`;
      data.cards.forEach(card => {
        popupHtml += `
          <div class="popup-item">
            <div class="popup-title">${card.title}</div>
            <div class="popup-location">${data.areaName}</div>
            <img src="${card.image}" />
            <div class="popup-actions">
              <button class="popup-delete-btn" onclick="deletePostcard('${card.id}', '${areaKey}')">Delete</button>
            </div>
          </div>`;
      });
      popupHtml += `</div>`;

      if (mapMarkers[areaKey]) {
        mapMarkers[areaKey].setPopupContent(popupHtml);
      } else {
        const dotIcon = L.divIcon({ className: 'custom-dot-marker', iconSize: [14, 14], iconAnchor: [7, 7] });
        const marker = L.marker([data.lat, data.lng], { icon: dotIcon }).bindPopup(popupHtml);
        markerClusterGroup.addLayer(marker);
        mapMarkers[areaKey] = marker;
      }
    }

    window.deletePostcard = function(cardId, areaKey) {
      const group = districtRegistry[areaKey];
      if (!group) return;
      group.cards = group.cards.filter(c => c.id !== cardId);

      if (group.cards.length === 0) {
        markerClusterGroup.removeLayer(mapMarkers[areaKey]);
        delete mapMarkers[areaKey];
        delete districtRegistry[areaKey];
      } else {
        updateMapMarker(areaKey);
      }

      saveStorage();
      renderSidebarList();
    };

    function renderSidebarList() {
      const query = searchInput.value.toLowerCase().trim();
      cardsContainer.innerHTML = "";

      Object.keys(districtRegistry).forEach(key => {
        const group = districtRegistry[key];
        group.cards.forEach(card => {
          if (card.title.toLowerCase().includes(query) || group.areaName.toLowerCase().includes(query)) {
            const cardEl = document.createElement('div');
            cardEl.className = 'mini-card';
            cardEl.innerHTML = `
              <img src="${card.image}" />
              <div class="mini-card-info">
                <strong>${card.title}</strong>
                <span>${group.areaName}</span>
              </div>
              <button class="delete-btn-text">Delete</button>`;

            const flyAction = () => {
              closeVault();
              markerClusterGroup.zoomToShowLayer(mapMarkers[key], () => mapMarkers[key].openPopup());
            };

            cardEl.querySelector('.mini-card-info').onclick = flyAction;
            cardEl.querySelector('img').onclick = flyAction;
            cardEl.querySelector('.delete-btn-text').onclick = (e) => {
              e.stopPropagation();
              deletePostcard(card.id, key);
            };

            cardsContainer.appendChild(cardEl);
          }
        });
      });
    }

    loadStorage();
  </script>
</body>
</html>
