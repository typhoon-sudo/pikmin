<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pikmin Postcard Vault</title>

  <!-- Favicon & PWA Settings -->
  <link rel="icon" type="image/png" href="pikminlogo.png">
  <link rel="apple-touch-icon" href="pikminlogo.png">
  <meta name="theme-color" content="#2e7d32">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">

  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS & MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, input, button, select, textarea, .leaflet-container {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif !important;
    }
    body { display: flex; height: 100vh; width: 100vw; overflow: hidden; background: #f4f6f8; position: relative; }
    #map { width: 100%; height: 100%; z-index: 1; }

    /* Permanent Floating Action Button (FAB) */
    #vault-trigger-btn {
      position: fixed;
      bottom: 24px;
      right: 20px;
      z-index: 99999;
      background: #2e7d32;
      color: #ffffff;
      border: none;
      padding: 14px 22px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    #vault-trigger-btn:active {
      transform: scale(0.95);
      background: #1b5e20;
    }

    /* Modal Backdrop */
    #modal-backdrop {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.5);
      z-index: 100000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #modal-backdrop.active {
      display: flex;
    }

    /* Vault Modal Window */
    #vault-modal {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 14px 18px;
      background: #2e7d32;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h2 { font-size: 1.1rem; font-weight: 700; }
    .close-modal-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      width: 30px; height: 30px;
      border-radius: 50%;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-body { overflow-y: auto; flex: 1; padding: 16px; }

    .form-container {
      background: #f8f9fa;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #e9ecef;
      margin-bottom: 16px;
    }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: #495057; }
    .form-group input { width: 100%; padding: 8px 10px; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.88rem; }
    #preview-container { display: none; margin-top: 8px; width: 100%; height: 110px; border-radius: 6px; overflow: hidden; border: 1px solid #ddd; }
    #preview-img { width: 100%; height: 100%; object-fit: contain; background: #111; }
    
    .btn-submit {
      width: 100%;
      padding: 10px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-submit:disabled { background: #adb5bd; cursor: not-allowed; }

    .search-box { width: 100%; padding: 8px 12px; border: 1px solid #ced4da; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; }
    .list-title { font-size: 0.8rem; font-weight: 700; color: #6c757d; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
    
    .mini-card { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid #e9ecef; border-radius: 8px; margin-bottom: 8px; background: #fff; }
    .mini-card img { width: 48px; height: 32px; object-fit: cover; border-radius: 4px; background: #eee; cursor: pointer; }
    .mini-card-info { flex: 1; font-size: 0.8rem; cursor: pointer; }
    .mini-card-info strong { display: block; color: #212529; }
    .mini-card-info span { color: #6c757d; font-size: 0.75rem; }
    .delete-btn-text { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; font-size: 0.72rem; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-weight: 600; }

    .custom-dot-marker { background-color: #2e7d32; border: 2px solid #ffffff; border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background-color: rgba(46, 125, 50, 0.3) !important; }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div { background-color: #2e7d32 !important; color: white !important; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Map Canvas -->
  <div id="map"></div>

  <!-- Permanent Floating Trigger Button -->
  <button id="vault-trigger-btn">✚ Open Vault</button>

  <!-- Modal Screen Overlay -->
  <div id="modal-backdrop">
    <div id="vault-modal">
      <div class="modal-header">
        <h2>Pikmin Postcard Vault</h2>
        <button class="close-modal-btn" id="close-modal-btn">✕</button>
      </div>

      <div class="modal-body">
        <div class="form-container">
          <form id="upload-form">
            <div class="form-group">
              <label for="card-title">Postcard Title</label>
              <input type="text" id="card-title" placeholder="e.g., Pikmin Monument" required />
            </div>

            <div class="form-group">
              <label for="area-input">District / City Area</label>
              <input type="text" id="area-input" placeholder="e.g., Central, Hong Kong" required />
            </div>

            <div class="form-group">
              <label for="image-input">Postcard Image</label>
              <input type="file" id="image-input" accept="image/*" required />
              <div id="preview-container">
                <img id="preview-img" src="" alt="Preview" />
              </div>
            </div>

            <button type="submit" id="submit-btn" class="btn-submit">Add to Map</button>
          </form>
        </div>

        <div>
          <div class="list-title">Saved Postcards</div>
          <input type="text" id="search-input" class="search-box" placeholder="Search saved cards..." />
          <div id="cards-container"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Leaflet JS & MarkerCluster JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }

    const map = L.map('map', { zoomControl: false, minZoom: 3, maxZoom: 19 }).setView([22.3193, 114.1694], 10);
    L.control.zoom({ position: 'topright' }).addTo(map);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors', minZoom: 3, maxZoom: 19
    }).addTo(map);

    const markerClusterGroup = L.markerClusterGroup({ showCoverageOnHover: false, maxClusterRadius: 45 });
    map.addLayer(markerClusterGroup);

    let districtRegistry = {};
    const mapMarkers = {};
    let currentBase64Image = "";

    const triggerBtn = document.getElementById('vault-trigger-btn');
    const modalBackdrop = document.getElementById('modal-backdrop');
    const closeModalBtn = document.getElementById('close-modal-btn');
    const vaultModal = document.getElementById('vault-modal');
    
    const imageInput = document.getElementById('image-input');
    const previewContainer = document.getElementById('preview-container');
    const previewImg = document.getElementById('preview-img');
    const uploadForm = document.getElementById('upload-form');
    const submitBtn = document.getElementById('submit-btn');
    const searchInput = document.getElementById('search-input');
    const cardsContainer = document.getElementById('cards-container');

    // Completely isolate button and modal DOM events from Leaflet
    L.DomEvent.disableClickPropagation(triggerBtn);
    L.DomEvent.disableTouchPropagation(triggerBtn);
    L.DomEvent.disableClickPropagation(vaultModal);
    L.DomEvent.disableTouchPropagation(vaultModal);

    function showModal() {
      modalBackdrop.classList.add('active');
    }

    function hideModal() {
      modalBackdrop.classList.remove('active');
    }

    triggerBtn.addEventListener('click', showModal);
    closeModalBtn.addEventListener('click', hideModal);
    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) hideModal();
    });

    searchInput.addEventListener('input', renderSidebarList);

    function saveStorage() {
      try {
        localStorage.setItem('pikmin_postcards_db', JSON.stringify(districtRegistry));
      } catch (e) {
        alert("Local storage limit reached.");
      }
    }

    function loadStorage() {
      const savedData = localStorage.getItem('pikmin_postcards_db');
      if (savedData) {
        districtRegistry = JSON.parse(savedData);
        Object.keys(districtRegistry).forEach(areaKey => updateMapMarker(areaKey));
        renderSidebarList();
      }
    }

    imageInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          currentBase64Image = event.target.result;
          previewImg.src = currentBase64Image;
          previewContainer.style.display = 'block';
        };
        reader.readAsDataURL(file);
      }
    });

    uploadForm.addEventListener('submit', async function(e) {
      e.preventDefault();
      const title = document.getElementById('card-title').value.trim();
      const area = document.getElementById('area-input').value.trim();
      const areaKey = area.toLowerCase();

      submitBtn.disabled = true;
      submitBtn.innerText = "Locating...";

      try {
        let lat, lng;
        if (districtRegistry[areaKey]) {
          lat = districtRegistry[areaKey].lat;
          lng = districtRegistry[areaKey].lng;
        } else {
          const endpoint = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(area)}`;
          const response = await fetch(endpoint, { headers: { 'Accept-Language': 'en' } });
          const results = await response.json();
          
          if (!results || results.length === 0) {
            alert("Could not locate that area. Try adding a city or country name.");
            return;
          }
          lat = parseFloat(results[0].lat);
          lng = parseFloat(results[0].lon);
        }

        if (!districtRegistry[areaKey]) {
          districtRegistry[areaKey] = { areaName: area, lat, lng, cards: [] };
        }

        const cardId = 'card_' + Date.now();
        districtRegistry[areaKey].cards.push({ id: cardId, title, image: currentBase64Image });

        saveStorage();
        updateMapMarker(areaKey);
        renderSidebarList();

        uploadForm.reset();
        previewContainer.style.display = 'none';
        currentBase64Image = "";

        hideModal();
        map.flyTo([lat, lng], 12, { duration: 1.2 });
      } catch (err) {
        alert("Geocoding connection error. Check your network.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Add to Map";
      }
    });

    function updateMapMarker(areaKey) {
      const data = districtRegistry[areaKey];
      let popupHtml = `<div style="width:220px; max-height:280px; overflow-y:auto;">`;
      data.cards.forEach(card => {
        popupHtml += `
          <div style="margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:8px;">
            <strong style="font-size:0.85rem; color:#333;">${card.title}</strong>
            <div style="font-size:0.75rem; color:#666; margin-bottom:4px;">${data.areaName}</div>
            <img src="${card.image}" style="width:100%; border-radius:4px; display:block;" />
            <button onclick="deletePostcard('${card.id}', '${areaKey}')" style="background:#ffebee; color:#c62828; border:none; padding:3px 6px; border-radius:4px; font-size:0.7rem; margin-top:4px; cursor:pointer;">Delete</button>
          </div>`;
      });
      popupHtml += `</div>`;

      if (mapMarkers[areaKey]) {
        mapMarkers[areaKey].setPopupContent(popupHtml);
      } else {
        const dotIcon = L.divIcon({ className: 'custom-dot-marker', iconSize: [14, 14], iconAnchor: [7, 7] });
        const marker = L.marker([data.lat, data.lng], { icon: dotIcon }).bindPopup(popupHtml);
        markerClusterGroup.addLayer(marker);
        mapMarkers[areaKey] = marker;
      }
    }

    window.deletePostcard = function(cardId, areaKey) {
      const group = districtRegistry[areaKey];
      if (!group) return;
      group.cards = group.cards.filter(c => c.id !== cardId);

      if (group.cards.length === 0) {
        markerClusterGroup.removeLayer(mapMarkers[areaKey]);
        delete mapMarkers[areaKey];
        delete districtRegistry[areaKey];
      } else {
        updateMapMarker(areaKey);
      }

      saveStorage();
      renderSidebarList();
    };

    function renderSidebarList() {
      const query = searchInput.value.toLowerCase().trim();
      cardsContainer.innerHTML = "";

      Object.keys(districtRegistry).forEach(key => {
        const group = districtRegistry[key];
        group.cards.forEach(card => {
          if (card.title.toLowerCase().includes(query) || group.areaName.toLowerCase().includes(query)) {
            const cardEl = document.createElement('div');
            cardEl.className = 'mini-card';
            cardEl.innerHTML = `
              <img src="${card.image}" />
              <div class="mini-card-info">
                <strong>${card.title}</strong>
                <span>${group.areaName}</span>
              </div>
              <button class="delete-btn-text">Delete</button>`;

            const flyAction = () => {
              hideModal();
              markerClusterGroup.zoomToShowLayer(mapMarkers[key], () => mapMarkers[key].openPopup());
            };

            cardEl.querySelector('.mini-card-info').onclick = flyAction;
            cardEl.querySelector('img').onclick = flyAction;
            cardEl.querySelector('.delete-btn-text').onclick = (e) => {
              e.stopPropagation();
              deletePostcard(card.id, key);
            };

            cardsContainer.appendChild(cardEl);
          }
        });
      });
    }

    loadStorage();
  </script>
</body>
</html>
